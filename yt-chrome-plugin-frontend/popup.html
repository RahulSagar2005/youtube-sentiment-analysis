<!DOCTYPE html>
<html>
<head>
    <title>YouTube Comment Insights</title>
    <style>
        /* Dark theme */
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            background-color: #1e1e1e;
            color: #f1f1f1;
            margin: 0;
            box-sizing: border-box;
            width: 380px;
        }

        h1 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .section {
            margin-bottom: 15px;
        }

        .section-title {
            font-weight: bold;
            color: #0099ff;
            margin-top: 10px;
            font-size: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
            margin-bottom: 8px;
        }

        img {
            width: 100%;
            margin-top: 6px;
            border-radius: 6px;
        }

        .metrics-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .metric {
            width: 48%;
            background-color: #2a2a2a;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            box-sizing: border-box;
        }

        .metric-title {
            font-size: 11px;
            color: #aaaaaa;
        }

        .metric-value {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 4px;
        }

        /* ✅ Top 25 Comments Table */
        .top-comments-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .top-comments-container::-webkit-scrollbar {
            width: 5px;
        }

        .top-comments-container::-webkit-scrollbar-track {
            background: #2a2a2a;
            border-radius: 4px;
        }

        .top-comments-container::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .top-comment-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background-color: #2a2a2a;
            border-radius: 6px;
            padding: 8px;
        }

        .top-comment-index {
            min-width: 22px;
            font-size: 11px;
            color: #777;
            padding-top: 2px;
            font-weight: bold;
        }

        .top-comment-text {
            flex: 1;
            font-size: 12px;
            color: #dddddd;
            line-height: 1.4;
            word-break: break-word;
        }

        .top-comment-badge {
            min-width: 76px;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 7px;
            border-radius: 12px;
            text-align: center;
            white-space: nowrap;
            align-self: flex-start;
        }

        p {
            font-size: 13px;
            color: #cccccc;
            margin: 4px 0;
        }
    </style>
</head>

<body>
    <h1>YouTube Comment Insights</h1>
    <div id="output" class="section"></div>
    <script src="popup.js"></script>
</body>
</html>
